[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purple-scaffold"
version = "0.1.0"
description = "Iterative purple-team harness with 5 specialist agents under a deterministic orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Optional: install with `pip install -e .[product]` to enable the
# LLM-API proxy (purple/proxy.py) used for testing deployed agent
# products (Cursor, Cline, Claude Desktop, Continue.dev). Pulls in
# mitmproxy for HTTPS interception and litellm for the panel-replay
# path.
product = [
    "mitmproxy>=11.0",
    "litellm>=1.0",
]

[tool.setuptools]
packages = ["purple"]
